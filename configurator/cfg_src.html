<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configurateur Dragon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  :root{
    --bg:#f3f1ec; --ink:#1c1b18; --muted:#6d6559; --line:#d9d3c7; --card:#fffdf9; --card2:#f6f2ea;
    --accent:#c0631a; --accent-ink:#fff; --premium:#b08321; --danger:#b23b32;
    --stage-1:#2c2823; --stage-2:#0e0c0a;
    --shadow:0 1px 2px rgba(30,24,14,.06),0 10px 30px rgba(30,24,14,.08);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#141310; --ink:#eee9df; --muted:#9c9587; --line:#2e2a23; --card:#1c1a16; --card2:#211e19;
    --accent:#e2903f; --accent-ink:#1a1408; --premium:#e0b24e; --danger:#e0705f;
    --stage-1:#23201a; --stage-2:#080706;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{
    --bg:#141310; --ink:#eee9df; --muted:#9c9587; --line:#2e2a23; --card:#1c1a16; --card2:#211e19;
    --accent:#e2903f; --accent-ink:#1a1408; --premium:#e0b24e; --danger:#e0705f;
    --stage-1:#23201a; --stage-2:#080706;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;
    line-height:1.45;display:flex;flex-direction:column;min-height:100%}
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;
    border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand .logo{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:21px;letter-spacing:-.01em}
  .brand .tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .head-right{display:flex;align-items:center;gap:16px}
  .modeswitch{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .modeswitch button{appearance:none;border:none;background:transparent;color:var(--muted);font:inherit;
    font-size:12.5px;font-weight:600;padding:7px 13px;cursor:pointer}
  .modeswitch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .price-tag{text-align:right;line-height:1.05}
  .price-tag .lbl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .price-tag .val{font-family:'Fraunces',serif;font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}

  main{flex:1;display:grid;grid-template-columns:minmax(0,3fr) minmax(380px,2fr);min-height:0}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .stage{position:relative;min-height:360px;background:radial-gradient(120% 100% at 50% 22%,var(--stage-1),var(--stage-2));overflow:hidden}
  .stage.drop{outline:2px dashed var(--accent);outline-offset:-10px}
  .stage canvas{display:block;width:100%;height:100%}
  .stage .hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#ccc5b8;opacity:.55;
    font-size:11.5px;font-family:'IBM Plex Mono',monospace;pointer-events:none}
  .panel{border-left:1px solid var(--line);background:var(--card);padding:16px 18px 30px;overflow:auto}
  @media (max-width:900px){.panel{border-left:none;border-top:1px solid var(--line)}}

  .group{padding:15px 0;border-bottom:1px solid var(--line)}
  .group:first-child{padding-top:2px}.group:last-child{border-bottom:none}
  .group h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 11px;font-weight:600;
    display:flex;justify-content:space-between;align-items:center}
  .addbtn{appearance:none;border:1px solid var(--accent);background:transparent;color:var(--accent);font:inherit;
    font-size:11.5px;font-weight:600;border-radius:7px;padding:4px 9px;cursor:pointer;text-transform:none;letter-spacing:0}

  .sw{display:flex;flex-wrap:wrap;gap:7px}
  .swatch{position:relative;width:27px;height:27px;border-radius:50%;cursor:pointer;border:2px solid transparent;
    box-shadow:0 0 0 1px var(--line) inset}
  .swatch[aria-pressed="true"]{border-color:var(--card);box-shadow:0 0 0 2px var(--accent)}
  .swatch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .zoneAdmin{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px}
  .zoneAdmin .top{display:flex;gap:8px;align-items:center;margin-bottom:9px}
  .zoneAdmin input[type=text]{flex:1;font:inherit;font-size:13.5px;font-weight:600;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .zoneAdmin .chk{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .zoneAdmin .del{appearance:none;border:none;background:none;color:var(--danger);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
  .clientzone{margin-bottom:14px}
  .clientzone .zh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .clientzone .zn{font-size:14px;font-weight:600}.clientzone .zc{font-size:12px;color:var(--muted)}

  .maprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line)}
  .maprow:last-child{border-bottom:none}
  .maprow .mn{font-family:'IBM Plex Mono',monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  select{font:inherit;font-size:12.5px;padding:5px 7px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}

  .fieldrow{display:flex;gap:10px;flex-wrap:wrap}
  .field{flex:1;min-width:120px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .field input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .importer{border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center;font-size:12.5px;color:var(--muted)}
  .btn-file{cursor:pointer;font:inherit;font-weight:600;font-size:13px;padding:8px 13px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);display:inline-block;margin-top:8px}
  .glbfile{display:flex;justify-content:space-between;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-bottom:10px}
  .glbfile button,.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:12px}

  .bill{list-style:none;margin:0 0 0;padding:0;font-size:13.5px}
  .bill li{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
  .bill li span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
  .bill li.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:600;font-size:15px}
  .bill li.total span{color:var(--ink)}
  .cta{width:100%;margin-top:14px;cursor:pointer;font:inherit;font-weight:600;font-size:15px;padding:12px;border-radius:10px;border:none;background:var(--accent);color:var(--accent-ink)}
  .cta:hover{filter:brightness(1.05)}
  .savebar{display:flex;gap:8px;margin-top:6px}
  .savebar button{flex:1;cursor:pointer;font:inherit;font-weight:600;font-size:13px;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--ink)}
  .savebar button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  textarea{width:100%;min-height:120px;font-family:'IBM Plex Mono',monospace;font-size:11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px;margin-top:8px}
  .hintline{font-size:12px;color:var(--muted);margin:8px 0 0}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
    padding:10px 17px;border-radius:9px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;max-width:88vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast b{color:var(--accent)}
  /* ===== Sections repliables (atelier) ===== */
  .group.collapsible>h2{cursor:pointer;user-select:none;-webkit-user-select:none}
  .group.collapsible>h2:hover{color:var(--ink)}
  .group.collapsible>h2 .caret{display:inline-block;margin-left:auto;padding-left:12px;color:var(--muted);font-size:10px;transition:transform .16s}
  .group.collapsible>h2:hover .caret{color:var(--accent)}
  .group.collapsed>h2 .caret{transform:rotate(-90deg)}
  .group.collapsed>h2{margin-bottom:0}
  .gbody{animation:gbin .16s ease}
  @keyframes gbin{from{opacity:.4}to{opacity:1}}

  .errline{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.4;color:var(--danger);font-weight:500;
    background:color-mix(in srgb,var(--danger) 12%,transparent);border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);
    border-radius:9px;padding:8px 11px;margin-top:9px}
  .cta:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;filter:none}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ===== Habillage premium (overrides) ===== */
  input,select{accent-color:var(--accent)}
  input[type=range]{-webkit-appearance:none;appearance:none;height:24px;width:100%;background:transparent!important;padding:0;border:none;cursor:pointer;margin:2px 0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:var(--line)}
  input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--accent);border:2px solid var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3)}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3)}

  header{box-shadow:0 1px 0 var(--line)}
  .price-tag .val{font-size:27px;letter-spacing:-.015em}
  .modeswitch{border-radius:11px;padding:3px;background:var(--card2)}
  .modeswitch button{border-radius:8px;transition:background .15s,color .15s}
  .modeswitch button[aria-pressed="true"]{box-shadow:0 1px 2px rgba(0,0,0,.22)}

  .panel{padding:20px 22px 44px}
  .group{padding:19px 0}
  .group h2{font-size:10.5px;letter-spacing:.17em}
  .group h2>span:first-child{position:relative;padding-left:15px}
  .group h2>span:first-child::before{content:"";position:absolute;left:0;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:2px;background:var(--accent)}

  .zoneAdmin{border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .zoneAdmin input[type=text]{border-radius:8px}
  .importer{border-radius:14px}
  .swatch{width:28px;height:28px;box-shadow:0 0 0 1px var(--line) inset,0 1px 2px rgba(0,0,0,.14);transition:transform .1s,box-shadow .12s}
  .swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent),0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}

  .clientzone{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px 15px;box-shadow:var(--shadow)}
  .clientzone .zn{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:16px;letter-spacing:0}
  .clientzone .zc{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em}

  .field input,select{border-radius:9px}
  .maprow select{min-width:150px}
  .cta{border-radius:12px;padding:13px;letter-spacing:.01em;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 32%,transparent)}
  .bill{font-size:14px}
  .bill li.total{font-family:'Fraunces',Georgia,serif;font-size:16px}
  .addbtn{border-radius:8px}
  .hintline{line-height:1.5}

  /* ===== Finitions (chips) ===== */
  .finrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .finchip{display:flex;align-items:center;gap:6px;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink);
    border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:4px 10px 4px 5px;cursor:pointer;transition:box-shadow .12s,border-color .12s}
  .finchip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
  .finchip .dot{width:17px;height:17px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.18) inset;flex:none}
  .finchip .sur{color:var(--muted);font-weight:500;font-size:10.5px}

  /* ===== Miniatures de variantes ===== */
  .vthumb{position:relative;width:52px;height:52px;border-radius:12px;overflow:hidden;flex:none;display:flex}
  .vthumb.sm{width:34px;height:34px;border-radius:9px}
  .vthumb .vstrip{flex:1;min-width:0}
  .vthumb .gloss{position:absolute;inset:0;box-shadow:0 0 0 1px var(--line) inset,0 1px 3px rgba(0,0,0,.18) inset;
    border-radius:inherit;background:linear-gradient(152deg,rgba(255,255,255,.4),rgba(255,255,255,0) 44%);pointer-events:none}
  .vthumb .vbadge{position:absolute;bottom:1px;right:2px;font-size:12px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
  .vthumb.sm .vbadge{font-size:9px}
  .vcard{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:9px;cursor:pointer;text-align:left;
    font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:9px 13px 9px 9px;box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s}
  .vcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .vcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
  .vcard .vinfo{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .vcard .vnm{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:15.5px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vcard .vsub{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.05em}
  .vcard .vpr{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:15.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ===== Choix du repère (client) ===== */
  .refchips{display:flex;flex-wrap:wrap;gap:7px}
  .refchip{display:flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);
    border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 13px;cursor:pointer;transition:border-color .12s,box-shadow .12s,background .12s}
  .refchip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
  .refchip .ic{font-size:15px;line-height:1}

  /* ===== Bouton thème + catalogue modèles ===== */
  .iconbtn{appearance:none;cursor:pointer;font-size:17px;line-height:1;width:38px;height:38px;border-radius:11px;
    border:1px solid var(--line);background:var(--card2);color:var(--ink);display:flex;align-items:center;justify-content:center;transition:border-color .12s,background .12s}
  .iconbtn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mcards{display:flex;flex-wrap:wrap;gap:9px}
  .mcard{display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:13px;padding:8px 12px 8px 8px;box-shadow:var(--shadow);
    transition:border-color .12s,box-shadow .12s;min-width:150px;flex:1}
  .mcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .mcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
  .mcard .mi{width:38px;height:38px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;
    background:radial-gradient(120% 120% at 50% 25%,var(--stage-1),var(--stage-2))}
  .mcard .mn{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mcard .ms{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.04em}

  /* ===== Aperçu Nuit/Ombre/Soleil (segmenté, exclusif) ===== */
  .viewtoggles{position:absolute;top:12px;right:12px;display:flex;z-index:3;padding:3px;border-radius:999px;
    background:rgba(20,17,12,.42);border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.28)}
  .viewtoggles button{appearance:none;font:inherit;font-size:12px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;
    color:#e8e1d3;border:none;background:transparent;transition:background .15s,color .15s}
  .viewtoggles button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .viewtoggles button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:520px){.viewtoggles button{padding:6px 9px;font-size:11px;gap:3px}}
  .nightnote{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:3;max-width:90%;
    font-size:11.5px;font-weight:500;color:#dfe6ff;text-align:center;line-height:1.35;
    background:rgba(24,28,44,.55);border:1px solid rgba(159,180,255,.28);border-radius:999px;padding:6px 14px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none}
  @media (max-width:520px){.nightnote{font-size:10.5px;bottom:30px}}

  /* ===== Assistant client (wizard) ===== */
  .stepper{display:flex;gap:2px;overflow-x:auto;padding:2px 0 14px;margin-bottom:8px;border-bottom:1px solid var(--line);scrollbar-width:thin}
  .stepitem{display:flex;align-items:center;gap:7px;flex:none;cursor:pointer;font:inherit;background:none;border:none;color:var(--muted);padding:6px 9px;border-radius:9px;transition:color .12s}
  .stepitem:hover{color:var(--ink)}
  .stepitem .stepnum{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--card2);border:1px solid var(--line);color:var(--muted);flex:none;transition:.12s}
  .stepitem .steplbl{font-size:12.5px;font-weight:600;white-space:nowrap}
  .stepitem.cur{color:var(--ink)}
  .stepitem.cur .stepnum{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .stepitem.done{color:var(--ink)}
  .stepitem.done .stepnum{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--accent)}
  .steptitle{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:21px;margin:2px 0 4px;letter-spacing:-.01em}
  .stepsub{font-size:13px;color:var(--muted);margin:0 0 16px}
  .stepbody{min-height:140px}
  .stepnav{display:flex;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
  .btn-sec,.btn-pri{flex:1;cursor:pointer;font:inherit;font-weight:600;font-size:15px;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--ink);transition:filter .12s,border-color .12s}
  .btn-sec:disabled{opacity:.4;cursor:not-allowed}
  .btn-pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
  .btn-pri:hover{filter:brightness(1.05)}
  .stepnav .cta{flex:1;margin:0}
  .zonefinishnote{font-size:11.5px;color:var(--muted);margin-top:6px}

<script>
/* Modele 3D par defaut embarque (injecte au build). "__" = non injecte. */
const DEFAULT_GLB_B64="__GLB_B64__";
const ROSE_GLB_B64="__ROSE_B64__";
const DEFAULT_GLB_NAME="BabyCrystalDragon.glb";

/* ===================== CONFIG TENANT (specificite Onlyfab) ===================== */
const TENANT = {
  brand:{ name:"Onlyfab", tagline:"Impression 3D", currency:"EUR", locale:"fr-FR" },
  palette:[
    {name:"Obsidienne",hex:"#26262e"},{name:"Ivoire",hex:"#e9e1cf"},{name:"Rubis",hex:"#a3252f"},
    {name:"Émeraude",hex:"#1f6b4f"},{name:"Saphir",hex:"#2f5aa6"},{name:"Améthyste",hex:"#6b3fa0",premium:true},
    {name:"Or",hex:"#c7972c",premium:true},{name:"Cuivre",hex:"#b5622e",premium:true},{name:"Turquoise",hex:"#2aa198"},{name:"Corail",hex:"#e06a4e",premium:true}
  ],
  defaults:{ base:5, perExtra:3, engravingFee:5, engravingMax:16 },
  tva:0.20,                     // TVA incluse dans les prix affichés (TTC)
  prod:{ baseDays:5, daysPerCm:0.6 }   // délai de fabrication à la demande
};
const uid=()=>Math.random().toString(36).slice(2,8);

/* ===================== MODE EMBARQUÉ (Shopify) =====================
   Quand le configurateur tourne dans une iframe sur une page produit Shopify,
   il ne gère PAS le panier lui-même : il transmet la configuration au thème
   parent (postMessage), qui sélectionne la variante et appelle /cart/add.js. */
const EMBED = (()=>{ try{
  const q=new URLSearchParams(location.search);
  if(q.get("embed")==="1"||q.get("embed")==="0") return q.get("embed")==="1";
  return window.parent && window.parent!==window;   // dans une iframe => embarqué
}catch(e){ return false; } })();
const EMBED_ORIGIN = (()=>{ try{ return new URLSearchParams(location.search).get("origin")||"*"; }catch(e){ return "*"; } })();
function postToHost(type,data){
  if(!EMBED) return;
  try{ window.parent.postMessage(Object.assign({source:"onlyfab-configurator",type},data||{}), EMBED_ORIGIN); }catch(e){}
}
/* Prix « source de vérité » fourni par le thème hôte (prix réel de la variante Shopify).
   Quand il est présent, il remplace l'estimation calculée localement. */
let embedPrice=null;              // { amount, currency, note }
let embedSizeTiers=null;          // [cm,...] tailles réellement disponibles en variante
const embMoney=n=>{ try{ return new Intl.NumberFormat((embedPrice&&embedPrice.locale)||TENANT.brand.locale,
  {style:"currency",currency:(embedPrice&&embedPrice.currency)||TENANT.brand.currency}).format(n); }catch(e){ return money(n); } };
function snapTier(v){ if(!embedSizeTiers||!embedSizeTiers.length) return v;
  return embedSizeTiers.reduce((best,t)=>Math.abs(t-v)<Math.abs(best-v)?t:best, embedSizeTiers[0]); }
/* met à jour l'affichage du prix (header + facture) selon la source de vérité */
function updatePriceDisplay(){
  const useEmbed = EMBED && embedPrice && isFinite(embedPrice.amount);
  const ph=document.getElementById("priceHead");
  if(ph) ph.textContent = useEmbed ? embMoney(embedPrice.amount) : money(priceBreakdown().total);
  if(typeof renderBillOnly==="function" && document.getElementById("billList")) renderBillOnly();
}

/* ===================== CATALOGUE MODÈLES (simulation) ===================== */
/* src:'glb' = utilise le dragon embarqué · 'placeholder' = dragon procédural.
   seed = couleurs/prix par défaut du modèle (appliqués à la 1re ouverture). */
const MODELS=[
  {key:"baby", name:"Baby Crystal Dragon", emoji:"🐉", src:"glb", glb:"baby",
    seed:{body:"#2f5aa6", crist:"#c7972c", base:5, refCm:10}},
  {key:"rose", name:"Baby Rose Dragon", emoji:"🌹", src:"glb", glb:"rose",
    seed:{body:"#d98fb0", crist:"#c7972c", base:6, refCm:9}},
  {key:"or", name:"Dragon d'Or", emoji:"✨", src:"glb", glb:"baby",
    seed:{body:"#c7972c", crist:"#26262e", base:9, refCm:12}},
  {key:"petit", name:"Petit Dragon", emoji:"🐲", src:"placeholder",
    seed:{body:"#1f6b4f", crist:"#a3252f", base:4, refCm:8}}
];
const modelByKey=k=>MODELS.find(m=>m.key===k)||MODELS[0];
function seedConfig(cfg,key){
  const s=(modelByKey(key).seed)||{};
  (cfg.variants||[]).forEach((v,vi)=>{
    (v.slots||[]).forEach(slot=>{ const nm=(slot.name||"").toLowerCase();
      slot.color = /crist|yeux|pointe|aile|accent|detail|corne/.test(nm) ? (s.crist||slot.color) : (s.body||slot.color); });
    if(s.base){ v.price = vi===0 ? s.base : +(s.base*1.6).toFixed(1); }
  });
  if(s.body) cfg.fixedColor="#26262e";
  if(s.refCm){ cfg.size.refCm=s.refCm; cfg.size.value=s.refCm; }
  return cfg;
}

/* ===================== ETAT ===================== */
const state={ mode:"atelier", modelKey:"baby", glb:null, config:null, view:{mode:"ombre"} };  // view.mode: nuit | ombre | soleil
let partMaterials={};   // partName -> [THREE.Material]
let partMeshes={};      // partName -> [THREE.Mesh]
let partList=[];        // noms des parties du modele courant

/* ===================== HELPERS ===================== */
const money=n=>new Intl.NumberFormat(TENANT.brand.locale,{style:"currency",currency:TENANT.brand.currency}).format(n);
const colorName=hex=>{const p=TENANT.palette.find(p=>p.hex.toLowerCase()===(hex||"").toLowerCase());return p?p.name:hex;};
const cfgKey=()=>"onlyfab.cfg."+state.modelKey;

function defaultFinishes(){
  return [
    {id:uid(),name:"Phospho Aqua",type:"phospho",colors:["#3b6b5e"],glow:"#66ffd6",sur:3},
    {id:uid(),name:"UV Améthyste",type:"photo",colors:["#d8d3dd","#7b3fb0"],sur:3},
    {id:uid(),name:"Dégradé Océan",type:"gradient",colors:["#2f5aa6","#2aa198"],sur:3},
    {id:uid(),name:"Bicolore Feu",type:"bi",colors:["#a3252f","#c7972c"],sur:3},
    {id:uid(),name:"Tricolore Aurore",type:"tri",colors:["#6b3fa0","#2f5aa6","#2aa198"],sur:3}
  ];
}
function partGroups(parts){
  const crist=parts.filter(p=>{const n=p.toLowerCase();return n.startsWith("couleur")||n.startsWith("paint")||n.startsWith("color")||/crist|pointe|spike|aile|wing|accent|detail|corne|horn/.test(n)||n==="spine";});
  const corps=parts.filter(p=>!crist.includes(p));
  return { corps:(corps.length?corps:parts.slice()), crist };
}
const titleCase=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
function defaultConfigForParts(parts){
  const {corps,crist}=partGroups(parts);
  const cName=(crist.length===1 && /^\p{L}+$/u.test(crist[0])) ? titleCase(crist[0]) : "Cristaux";
  const vUnie={id:uid(),name:"Couleur unie",price:5,slots:[{id:uid(),name:"Couleur",parts:parts.slice(),color:"#2f5aa6"}]};
  const s2=[{id:uid(),name:"Corps",parts:corps,color:"#2f5aa6"}];
  if(crist.length) s2.push({id:uid(),name:cName,parts:crist,color:"#c7972c"});
  const vBi={id:uid(),name:(crist.length?"2 couleurs":"Bicolore"),price:8,slots:s2};
  const variants=[vUnie,vBi];
  return { variants, activeVariantId:vUnie.id, fixedColor:"#26262e",
           premium:{ colors:TENANT.palette.filter(p=>p.premium).map(p=>p.hex), surcharge:2 },
           finishes:defaultFinishes(),
           engraving:{offered:true,added:false,fee:TENANT.defaults.engravingFee,maxLen:TENANT.defaults.engravingMax,minPct:40,rot:0,text:""},
           placard:{dx:0,dy:0,dz:0,scale:1,visible:true},
           engrave:{dx:0,dy:0,dz:0,scale:1,rot:0,anchor:""},
           size:{min:6,max:18,value:10,refCm:10,exp:2,gauge:true} };
}
function loadConfig(parts){
  try{ const s=localStorage.getItem(cfgKey()); if(s){ const c=JSON.parse(s);
    if(!c.variants) throw 0;   // ancienne config incompatible -> defauts
    if(!c.premium) c.premium={colors:TENANT.palette.filter(p=>p.premium).map(p=>p.hex),surcharge:2};
    if(!c.finishes) c.finishes=defaultFinishes();
    if(c.fixedColor===undefined) c.fixedColor="#26262e";
    if(!c.activeVariantId||!c.variants.find(v=>v.id===c.activeVariantId)) c.activeVariantId=(c.variants[0]||{}).id;
    if(!c.placard) c.placard={dx:0,dy:0,dz:0,scale:1,visible:true};
    if(!c.engrave) c.engrave={dx:0,dy:0,dz:0,scale:1,rot:0,anchor:""}; else if(c.engrave.anchor===undefined) c.engrave.anchor="";
    if(!c.size) c.size={min:6,max:18,value:10,refCm:10,exp:2,gauge:true};
    else if(c.size.max>40){ const f=x=>Math.round((x/10)*2)/2; const vv=f(c.size.value); c.size={min:f(c.size.min),max:f(c.size.max),value:vv,refCm:vv,exp:2,gauge:true}; }
    if(c.size.gauge===undefined) c.size.gauge=true;
    if(c.size.ref!==undefined) delete c.size.ref;
    if(c.size.refCm===undefined) c.size.refCm=c.size.value||10;
    if(c.size.exp===undefined) c.size.exp=2;
    if(c.size.pricePerCm!==undefined) delete c.size.pricePerCm;
    const e=c.engraving||{};
    let minPct=(e.minPct!=null?e.minPct:null);
    if(minPct==null){ const rng=(c.size.max-c.size.min)||1; minPct=(e.minCm!=null)?Math.max(0,Math.min(100,Math.round((e.minCm-c.size.min)/rng*100))):40; }
    c.engraving={ offered:(e.offered!==undefined?e.offered:true), added:!!e.added,
      fee:(e.fee!=null?e.fee:TENANT.defaults.engravingFee), maxLen:(e.maxLen||TENANT.defaults.engravingMax),
      minPct:minPct, rot:(e.rot||0), text:(e.text||"") };
    return c; } }catch(e){}
  return seedConfig(defaultConfigForParts(parts), state.modelKey);   // 1re ouverture d'un modèle : défauts spécifiques
}
function saveConfig(){ try{ localStorage.setItem(cfgKey(),JSON.stringify(state.config)); }catch(e){} }
/* undo (atelier) + réordonnancement */
let undoStack=[];
function snapshot(){ try{ undoStack.push(JSON.stringify(state.config)); if(undoStack.length>30)undoStack.shift(); }catch(e){} }
function undo(){ if(!undoStack.length){toast("Rien à annuler");return;} try{ state.config=JSON.parse(undoStack.pop()); saveConfig(); if(root)applyColors(); if(root)applySizeScale(); renderPanel(); toast("Annulé"); }catch(e){} }
function moveArr(arr,i,dir){ const j=i+dir; if(j<0||j>=arr.length)return false; const t=arr[i];arr[i]=arr[j];arr[j]=t; return true; }
const activeVariant=()=>state.config.variants.find(v=>v.id===state.config.activeVariantId)||state.config.variants[0];
const colorIsPremium=hex=>((state.config.premium&&state.config.premium.colors)||[]).some(h=>h.toLowerCase()===(hex||"").toLowerCase());
const finishById=id=>((state.config&&state.config.finishes)||[]).find(f=>f.id===id);
function slotSurcharge(s){ if(s.finishId){const f=finishById(s.finishId);return f?(f.sur||0):0;} return colorIsPremium(s.color)?((state.config.premium&&state.config.premium.surcharge)||0):0; }
/* seuil de gravure : % de la plage (min→max) converti en cm */
function engraveMinCm(){
  const eng=state.config&&state.config.engraving, sz=state.config&&state.config.size;
  if(!eng||!sz) return 0;
  return sz.min + ((eng.minPct||0)/100)*((sz.max-sz.min)||0);
}
const engMinCmDisp=()=>Math.round(engraveMinCm()*2)/2;
/* gravure choisie ? -> taille minimale effective (bornée à la plage) */
function engraveChosen(){ const e=state.config&&state.config.engraving; return !!(e&&e.offered&&e.added&&e.minPct>0); }
function engEffMin(){ const sz=state.config&&state.config.size; if(!sz)return 0; return engraveChosen()?Math.max(sz.min,Math.min(sz.max,engMinCmDisp())):sz.min; }
function engraveError(){
  const eng=state.config&&state.config.engraving, sz=state.config&&state.config.size;
  return !!(eng&&eng.offered&&eng.added&&(eng.text||"").trim()&&(eng.minPct>0)&&sz&&sz.value<engMinCmDisp()-1e-9);
}

/* facteur volumétrique : prix = base × (taille / taille_réf)^effet  (effet 1=linéaire … 3=volume) */
function sizeFactor(){
  const sz=state.config&&state.config.size; if(!sz)return 1;
  const r=sz.refCm||sz.value||10, e=(sz.exp!=null?sz.exp:2);
  const f=Math.pow((sz.value||r)/r, e);
  return (isFinite(f)&&f>0)?f:1;
}
const round1=x=>Math.round(x*10)/10;
function priceBreakdown(){
  const lines=[]; const v=activeVariant(); const sz=state.config.size;
  const base=v?v.price:0; const modelP=round1(base*sizeFactor());
  lines.push({label:(v?v.name:"—")+(sz?` · ${sz.value} cm`:""), amount:modelP});
  if(v){ let sup=0; v.slots.forEach(s=>sup+=slotSurcharge(s)); if(sup>0) lines.push({label:"Suppléments couleurs",amount:+sup.toFixed(2)}); }
  const eng=state.config.engraving;
  if(eng.offered && eng.added && (eng.text||"").trim()) lines.push({label:"Gravure",amount:eng.fee});
  return { lines, total:+lines.reduce((s,l)=>s+l.amount,0).toFixed(2) };
}
function cartPayload(){
  const v=activeVariant(); const props={};
  props["Variante"]=v?v.name:"—";
  if(v) v.slots.forEach(s=>{const f=s.finishId?finishById(s.finishId):null;props[s.name]=f?(f.name+" (finition)"):(colorName(s.color)+(colorIsPremium(s.color)?" (premium)":""));});
  const eng=state.config.engraving; props["Gravure"]=(eng.offered&&eng.added&&eng.text.trim())?eng.text.trim():"—";
  if(state.config.size) props["Taille"]=state.config.size.value+" cm";
  props["Modèle 3D"]=state.glb?state.glb.name:"placeholder";
  return { productHandle:"dragon-"+state.modelKey.replace(/\W+/g,"-").toLowerCase(), quantity:1, price:priceBreakdown().total, properties:props, spec:productionSpec(), delay:prodDelay() };
}
/* fiche de production exploitable (zone -> couleur/finition/filament, taille, gravure) */
function productionSpec(){
  const v=activeVariant(), sz=state.config.size, eng=state.config.engraving;
  const zones=(v?v.slots:[]).map(s=>{ const f=s.finishId?finishById(s.finishId):null;
    return { zone:s.name, parts:(s.parts||[]).slice(),
      type:f?f.type:"uni", couleur:f?null:colorName(s.color), hex:f?null:s.color,
      finition:f?f.name:null, filaments:f?(f.colors||[]):[s.color], premium:!f&&colorIsPremium(s.color) };
  });
  return { modele:(modelByKey(state.modelKey).name)||state.modelKey, variante:v?v.name:"—",
    taille_cm:sz?sz.value:null, taille_mm:sz?Math.round(sz.value*10):null,
    gravure:(eng.offered&&eng.added&&(eng.text||"").trim())?{texte:eng.text.trim(),rot_deg:Math.round((eng.rot||0)*180/Math.PI)}:null,
    zones };
}
function prodDelay(){ const sz=state.config.size, cm=sz?Math.max(sz.min,sz.value):10;
  const d=Math.round(TENANT.prod.baseDays + TENANT.prod.daysPerCm*cm); return {min:d, max:d+3}; }
/* ===================== PANIER (simulé, local) ===================== */
let cart=[]; try{cart=JSON.parse(localStorage.getItem("onlyfab.cart")||"[]");}catch(e){}
const saveCart=()=>{try{localStorage.setItem("onlyfab.cart",JSON.stringify(cart));}catch(e){}};
const cartCount=()=>cart.reduce((n,l)=>n+(l.qty||1),0);
const cartSubtotal=()=>cart.reduce((s,l)=>s+(l.price||0)*(l.qty||1),0);
function addToCart(qty){ const p=cartPayload(); p.qty=Math.max(1,qty||1); p.id=uid(); p.model=state.modelKey;
  cart.push(p); saveCart(); updateCartBadge(); }
function updateCartBadge(){ const b=document.getElementById("cartCount"); if(b){const n=cartCount(); b.textContent=n; b.hidden=n===0;} }

/* ===================== 3D ===================== */
const THREE_OK=typeof THREE!=="undefined", GLTF_OK=THREE_OK&&typeof THREE.GLTFLoader!=="undefined";

function drawPlacard(){

  roundRect(ctx,ix,iy,iw,ih,ir);ctx.strokeStyle=gold;ctx.lineWidth=4;ctx.stroke();

  const goldy=ctx.createLinearGradient(0,cy-72,0,cy+72);
  goldy.addColorStop(0,"#ffedb0");goldy.addColorStop(.48,"#e6b24e");goldy.addColorStop(1,"#a9761f");

  gx.fillText(name,cx,cy);gx.shadowBlur=0;                                     // texte lumineux

  x.strokeStyle="rgba(226,144,63,0.95)";x.lineWidth=2.5;roundRect(x,3,3,W-6,H-6,24);x.stroke();
  x.fillStyle="#f4eee2";x.font=font;x.textAlign="center";x.textBaseline="middle";

}
function buildGauge(){

  const b=new THREE.Box3(); let has=false;
  Object.values(partMeshes).forEach(a=>a.forEach(m=>{b.expandByObject(m);has=true;}));
  if(!has||!isFinite(b.min.x))return null;
  const mn=b.min,mx=b.max, sx=mx.x-mn.x, sy=mx.y-mn.y, sz=mx.z-mn.z, maxDim=Math.max(sx,sy,sz)||1;

  const main=[], wit=[]; const seg=(A,ax,ay,az,bx,by,bz)=>A.push(ax,ay,az,bx,by,bz);
  // UNE seule cote, le long de la PLUS GRANDE dimension (= "Taille" réglée par le client)
  let lx,ly,lz;
  if(sx>=sy && sx>=sz){                    // Longueur (X) : bas-avant
    const Ly=mn.y-gap, Lz=mx.z;
    seg(main, mn.x,Ly,Lz, mx.x,Ly,Lz);
    seg(main, mn.x,Ly-cap,Lz, mn.x,Ly+cap,Lz); seg(main, mx.x,Ly-cap,Lz, mx.x,Ly+cap,Lz);
    seg(wit, mn.x,mn.y,Lz, mn.x,Ly-cap,Lz); seg(wit, mx.x,mn.y,Lz, mx.x,Ly-cap,Lz);
    lx=(mn.x+mx.x)/2; ly=Ly-gap*0.95; lz=Lz;

    seg(main, Px,Py,mn.z, Px,Py,mx.z);
    seg(main, Px,Py-cap,mn.z, Px,Py+cap,mn.z); seg(main, Px,Py-cap,mx.z, Px,Py+cap,mx.z);
    seg(wit, Px,mn.y,mn.z, Px,Py-cap,mn.z); seg(wit, Px,mn.y,mx.z, Px,Py-cap,mx.z);
    lx=Px; ly=Py-gap*0.95; lz=(mn.z+mx.z)/2;
  } else {                                  // Hauteur (Y) : gauche-avant
    const Hx=mn.x-gap, Hz=mx.z;
    seg(main, Hx,mn.y,Hz, Hx,mx.y,Hz);
    seg(main, Hx-cap,mn.y,Hz, Hx+cap,mn.y,Hz); seg(main, Hx-cap,mx.y,Hz, Hx+cap,mx.y,Hz);
    seg(wit, mn.x,mn.y,Hz, Hx-cap,mn.y,Hz); seg(wit, mn.x,mx.y,Hz, Hx-cap,mx.y,Hz);

    const l=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0xe9dfca,transparent:true,opacity:op}));return l;};   // depthTest actif => occulté par le dragon
  g.add(mkLines(main,0.92)); g.add(mkLines(wit,0.4));
  gaugeLabels=[];
  const s=makeLabelSprite("Taille "+fmt(CM(maxDim))+" cm"); s.position.set(lx,ly,lz); g.add(s); gaugeLabels.push(s);   // taille réglée dans loop()
  return g;
}
function setGauge(){

/* centre la caméra sur le CENTRE DU DRAGON, avec un zoom qui laisse voir les cotes */
function frameScene(){
  const bAll=new THREE.Box3(); let hasAll=false;
  const bDragon=new THREE.Box3(); let hasD=false;
  if(root){ root.updateWorldMatrix(true,true);
    Object.values(partMeshes).forEach(a=>a.forEach(m=>{bDragon.expandByObject(m);bAll.expandByObject(m);hasD=true;hasAll=true;})); }
  if(refGroup){ refGroup.updateWorldMatrix(true,true); bAll.expandByObject(refGroup); hasAll=true; }
  if(!hasAll)return;
  // point visé = centre du dragon (x,z ~ 0 => lookAt(0,cY,0))
  const cY = hasD ? bDragon.getCenter(new THREE.Vector3()).y : bAll.getCenter(new THREE.Vector3()).y;
  cam.target=cY; cam.tx=0; cam.tz=0;   // recentre le point visé (annule le pan)
  // rayon : couvrir l'écart max (haut/bas et gauche/droite) depuis ce point
  const st=document.querySelector(".stage"); const aspect=st?Math.max(0.6,st.clientWidth/Math.max(1,st.clientHeight)):1.3;
  const halfV=Math.max(bAll.max.y-cY, cY-bAll.min.y);
  const halfH=Math.max(Math.abs(bAll.max.x), Math.abs(bAll.min.x));
  const fovR=42*Math.PI/180, tanV=Math.tan(fovR/2);
  // les pastilles de cote sont dimensionnées à ~0.19·rayon de large (loop) -> on réserve la place à gauche
  const labAllow=gaugeLabels.length?0.12:0;
  const radV=halfV/Math.max(0.2,(tanV-labAllow*0.7)), radH=halfH/Math.max(0.2,(tanV*aspect-labAllow));
  cam.radius=Math.max(6, Math.min(30, Math.max(radV,radH)*1.14+0.9));
}

}

function mountGLB(gltfScene){

    const nm=o.name||o.material.name||("part_"+partList.length);
    (partMaterials[nm]=partMaterials[nm]||[]).push(o.material);
    (partMeshes[nm]=partMeshes[nm]||[]).push(o); if(!partList.includes(nm))partList.push(nm);
  }});

  const box=new THREE.Box3().setFromObject(gltfScene);
  const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());

  wrap.add(buildNameplate(b2)); wrap.add(buildEngravePlate(b2));
  modelBaseRadius=Math.max(6,maxDim*sc*1.9); cam.radius=modelBaseRadius*((state.config&&state.config.size?state.config.size.max:10)/10)+3; cam.target=(b2.max.y+b2.min.y)/2;

}

function applyVertexColors(geo,stops,banded){
  const pos=geo.attributes.position,n=pos.count; let mn=Infinity,mx=-Infinity;
  for(let i=0;i<n;i++){const y=pos.getY(i);if(y<mn)mn=y;if(y>mx)mx=y;}
  const C=stops.map(h=>new THREE.Color(h)),seg=Math.max(1,C.length-1),arr=new Float32Array(n*3);
  for(let i=0;i<n;i++){const t=(pos.getY(i)-mn)/((mx-mn)||1);let c;
    if(banded){const idx=Math.min(C.length-1,Math.floor(t*C.length));c=C[idx];}
    else{const fp=t*seg,i0=Math.min(seg,Math.floor(fp)),i1=Math.min(seg,i0+1);c=C[i0].clone().lerp(C[i1],fp-i0);}
    arr[i*3]=c.r;arr[i*3+1]=c.g;arr[i*3+2]=c.b;}
  geo.setAttribute('color',new THREE.BufferAttribute(arr,3));
}
function applyColors(){
  const v=activeVariant();

    const slot=v?v.slots.find(s=>(s.parts||[]).includes(p)):null;
    const f=slot&&slot.finishId?finishById(slot.finishId):null;
    const items=(partMeshes[p]&&partMeshes[p].length)?partMeshes[p].map(o=>({mat:o.material,geo:o.geometry})):(partMaterials[p]||[]).map(mat=>({mat,geo:null}));
    items.forEach(({mat,geo})=>{ if(!mat)return;
      if(mat.emissive)mat.emissive.set(0,0,0); if("emissiveIntensity"in mat)mat.emissiveIntensity=1; mat.vertexColors=false;
      if(f){

function resize(){const s=document.querySelector(".stage"),w=s.clientWidth,h=s.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
function panCamera(dx,dy){                       // déplace le point visé dans le plan écran
  if(!camera)return;
  const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
  const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
  const k=cam.radius*0.0016;
  cam.tx+=(-dx*right.x + dy*up.x)*k; cam.target+=(-dx*right.y + dy*up.y)*k; cam.tz+=(-dx*right.z + dy*up.z)*k;
}
function zoomAt(e,c){
  cam.auto=false;
  const rect=c.getBoundingClientRect();
  const nx=((e.clientX-rect.left)/rect.width)*2-1, ny=-((e.clientY-rect.top)/rect.height)*2+1;
  const oldR=cam.radius, newR=Math.max(3.0,Math.min(70,oldR+e.deltaY*0.02));
  if(camera){ const p=new THREE.Vector3(nx,ny,0.5).unproject(camera);
    const dir=p.sub(camera.position).normalize(); const hit=camera.position.clone().add(dir.multiplyScalar(oldR));
    const f=(oldR-newR)/oldR; cam.tx+=(hit.x-cam.tx)*f; cam.target+=(hit.y-cam.target)*f; cam.tz+=(hit.z-cam.tz)*f; }
  cam.radius=newR;
}
function bindControls(c){
  let d=false,pan=false,lx=0,ly=0;
  const isPan=e=>e.button===2||e.button===1||e.shiftKey;
  const dn=e=>{d=true;cam.auto=false;pan=isPan(e);const p=e.touches?e.touches[0]:e;lx=p.clientX;ly=p.clientY;};
  const mv=e=>{if(!d)return;const p=e.touches?e.touches[0]:e;const dx=p.clientX-lx,dy=p.clientY-ly;
    if(pan){ panCamera(dx,dy); }
    else { cam.theta-=dx*.008; cam.phi=Math.max(.08,Math.min(3.06,cam.phi-dy*.008)); }
    lx=p.clientX;ly=p.clientY;if(e.cancelable)e.preventDefault();};
  const up=()=>{d=false;pan=false;};
  c.addEventListener("mousedown",dn);addEventListener("mousemove",mv);addEventListener("mouseup",up);
  c.addEventListener("contextmenu",e=>e.preventDefault());
  // tactile : 1 doigt = rotation · 2 doigts = pan + pinch zoom
  let pinch=0,tmx=0,tmy=0;
  c.addEventListener("touchstart",e=>{cam.auto=false;
    if(e.touches.length===2){d=false;const a=e.touches[0],b=e.touches[1];pinch=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);tmx=(a.clientX+b.clientX)/2;tmy=(a.clientY+b.clientY)/2;}
    else{d=true;pan=false;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}},{passive:true});
  c.addEventListener("touchmove",e=>{
    if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];const nd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
      cam.radius=Math.max(3.0,Math.min(70,cam.radius*(pinch/(nd||pinch))));pinch=nd;
      const mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;panCamera(mx-tmx,my-tmy);tmx=mx;tmy=my;
      if(e.cancelable)e.preventDefault();}
    else if(d){const p=e.touches[0];cam.theta-=(p.clientX-lx)*.008;cam.phi=Math.max(.08,Math.min(3.06,cam.phi-(p.clientY-ly)*.008));lx=p.clientX;ly=p.clientY;if(e.cancelable)e.preventDefault();}
  },{passive:false});
  addEventListener("touchend",up);
  c.addEventListener("wheel",e=>{zoomAt(e,c);e.preventDefault();},{passive:false});
}
function loop(){requestAnimationFrame(loop);if(cam.auto&&!reduce)cam.theta+=.0013;const r=cam.radius;
  const ox=r*Math.sin(cam.phi)*Math.sin(cam.theta), oy=r*Math.cos(cam.phi), oz=r*Math.sin(cam.phi)*Math.cos(cam.theta);
  camera.position.set(cam.tx+ox, cam.target+oy, cam.tz+oz);
  camera.lookAt(cam.tx,cam.target,cam.tz);
  if(gaugeLabels.length){const h=Math.max(.3,cam.radius*0.05);gaugeLabels.forEach(s=>s.scale.set(h*(s.userData.aspect||3.8),h,1));}
  renderer.render(scene,camera);}

/* ---------- MODE CLIENT ---------- */
/* ---------- MODE CLIENT : assistant étape par étape ---------- */
function clientSteps(){
  const steps=[
    {key:"model", short:"Dragon", title:"Choisis ton dragon", render:stepModel},
    {key:"couleurs", short:"Couleurs", title:"Couleurs", render:stepCouleurs}
  ];
  if(state.config.engraving && state.config.engraving.offered) steps.push({key:"gravure", short:"Gravure", title:"Gravure", render:stepGravure});
  steps.push({key:"taille", short:"Taille", title:"Taille", render:stepTaille});
  steps.push({key:"recap", short:"Récap", title:"Récapitulatif", render:stepRecap});
  return steps;
}
function renderClient(P){
  const steps=clientSteps();
  if(state.step==null)state.step=0;
  state.step=Math.max(0,Math.min(state.step,steps.length-1));
  const idx=state.step;
  // barre d'étapes cliquable
  const bar=el("div","stepper");
  steps.forEach((s,i)=>{const it=el("button","stepitem"+(i===idx?" cur":"")+(i<idx?" done":""));it.type="button";
    it.innerHTML=`<span class="stepnum">${i<idx?"✓":(i+1)}</span><span class="steplbl">${s.short}</span>`;
    it.onclick=()=>{state.step=i;renderPanel();};bar.appendChild(it);});
  P.appendChild(bar);
  // titre + corps
  P.appendChild(el("div","steptitle",steps[idx].title));
  const body=el("div","stepbody");steps[idx].render(body);P.appendChild(body);
  // navigation
  const nav=el("div","stepnav");
  const prev=el("button","btn-sec","‹ Précédent");prev.type="button";prev.disabled=idx===0;prev.onclick=()=>{state.step=idx-1;renderPanel();};
  nav.appendChild(prev);
  if(idx<steps.length-1){const next=el("button","btn-pri","Suivant ›");next.type="button";next.onclick=()=>{state.step=idx+1;renderPanel();};nav.appendChild(next);}
  else{const cta=el("button","cta","Ajouter au panier");cta.id="addCta";
    cta.onclick=()=>{ if(engraveError()){updEngErr();toast("Taille trop petite pour la gravure — augmentez la taille ou retirez la gravure.");return;}
      if(EMBED){ const p=cartPayload(); const qty=Math.max(1,state.qty||1);
        postToHost("add",{payload:p, qty, model:state.modelKey});
        toast("Ajout au panier…"); return; }
      addToCart(state.qty||1); toast(`Ajouté au panier`); openCart(); };
    nav.appendChild(cta);}
  P.appendChild(nav);
  priceHead(); updEngErr();
}
function stepModel(P){
  P.appendChild(el("p","stepsub","Sélectionne le dragon que tu veux personnaliser."));
  P.appendChild(modelPicker());
}
function variantCards(P){
  state.config.variants.forEach(v=>{const on=state.config.activeVariantId===v.id;
    const b=el("button","vcard");b.type="button";b.setAttribute("aria-pressed",on);
    b.appendChild(variantThumb(v));
    const nSlots=(v.slots||[]).length, hasFin=(v.slots||[]).some(s=>s.finishId);
    const info=el("div","vinfo");info.innerHTML=`<span class="vnm">${v.name}</span><span class="vsub">${nSlots} couleur${nSlots>1?"s":""}${hasFin?" · finition":""}</span>`;
    b.appendChild(info);b.appendChild(el("span","vpr",money(v.price)));
    b.onclick=()=>{state.config.activeVariantId=v.id;saveConfig();applyColors();renderPanel();};P.appendChild(b);});
}
function stepCouleurs(P){
  P.appendChild(el("p","stepsub","Choisis une déclinaison, puis la couleur (ou une finition spéciale) de chaque zone."));
  variantCards(P);
  const v=activeVariant();
  const gc=el("div");gc.style.marginTop="14px";
  if(!v||!v.slots.length) gc.appendChild(el("p","hintline","Aucune couleur à personnaliser pour cette déclinaison."));
  else v.slots.forEach(s=>{const zEl=el("div","clientzone");
    const fin=s.finishId?finishById(s.finishId):null;
    const lbl=fin?(fin.name+" ✨"):(colorName(s.color)+(colorIsPremium(s.color)?" ★":""));
    zEl.appendChild(el("div","zh",`<span class="zn">${s.name}</span><span class="zc">${lbl}</span>`));
    zEl.appendChild(slotColorRow(s,()=>{saveConfig();applyColors();renderPanel();}));   // couleurs + finitions
    gc.appendChild(zEl);});
  P.appendChild(gc);
}
function stepFinitions(P){
  P.appendChild(el("p","stepsub","Ajoute une finition spéciale à une zone (optionnel)."));
  const v=activeVariant();
  if(!v||!v.slots.length){P.appendChild(el("p","hintline","Aucune zone à personnaliser."));return;}
  v.slots.forEach(s=>{const zEl=el("div","clientzone");
    const fin=s.finishId?finishById(s.finishId):null;
    zEl.appendChild(el("div","zh",`<span class="zn">${s.name}</span><span class="zc">${fin?fin.name+" ✨":"couleur unie"}</span>`));
    zEl.appendChild(finishPickerRow(s,()=>{saveConfig();applyColors();renderPanel();}));
    P.appendChild(zEl);});
}
function stepGravure(P){
  const eng=state.config.engraving;
  P.appendChild(el("p","stepsub","Fais graver un texte sous la tête du dragon (optionnel)."));
  const optWrap=el("label","chk");optWrap.style.fontSize="14px";optWrap.style.color="var(--ink)";
  const ob=el("input");ob.type="checkbox";ob.checked=!!eng.added;ob.style.width="auto";
  optWrap.appendChild(ob);optWrap.appendChild(document.createTextNode(` Ajouter une gravure (+ ${money(eng.fee)})`));
  P.appendChild(optWrap);
  const f=el("div","field");f.style.marginTop="12px";f.hidden=!eng.added;
  f.innerHTML='<label>Votre texte</label>';
  const inp=el("input");inp.type="text";inp.maxLength=eng.maxLen;inp.value=eng.text;inp.placeholder="ex. prénom, date…";
  inp.oninput=()=>{eng.text=inp.value;saveConfig();drawEngrave();updateEngraveVisibility();priceHead();updEngErr();};
  f.appendChild(inp);f.appendChild(el("p","hintline",`${eng.maxLen} caractères max`));
  // rotation de la gravure (client)
  const rf=el("div","field");rf.style.marginTop="10px";rf.innerHTML='<label>Orientation du texte</label>';
  const ri=el("input");ri.type="range";ri.min=(-Math.PI).toFixed(3);ri.max=(Math.PI).toFixed(3);ri.step="0.05";ri.value=eng.rot||0;
  ri.style.border="none";ri.style.padding="0";ri.style.background="transparent";ri.style.width="100%";
  ri.oninput=()=>{eng.rot=parseFloat(ri.value)||0;saveConfig();drawEngrave();};
  rf.appendChild(ri);rf.appendChild(el("p","hintline","Tourne l'aperçu sous la tête du dragon pour voir la gravure."));
  f.appendChild(rf);
  P.appendChild(f);
  ob.onchange=()=>{eng.added=ob.checked;f.hidden=!ob.checked;
    if(ob.checked){ const m=engEffMin(); if(state.config.size && state.config.size.value<m){ state.config.size.value=m; applySizeScale(); } }  // taille min par défaut
    saveConfig();drawEngrave();updateEngraveVisibility();priceHead();updEngErr();};
  if(eng.minPct>0) P.appendChild(el("p","hintline",`La gravure nécessite une taille d'au moins ${engMinCmDisp()} cm (appliquée automatiquement).`));
}
function stepTaille(P){
  const sz=state.config.size; if(!sz){P.appendChild(el("p","hintline","—"));return;}
  const effMin=engEffMin(), gravure=engraveChosen()&&effMin>sz.min;
  if(gravure && sz.value<effMin){ sz.value=effMin; applySizeScale(); saveConfig(); priceHead(); }   // snap au minimum gravure
  P.appendChild(el("p","stepsub","Règle la taille du dragon — le prix s'ajuste automatiquement."));
  const f=el("div","field");f.innerHTML=`<label>Taille : <b id="szVal">${sz.value} cm</b></label>`;
  const tiered = EMBED && embedSizeTiers && embedSizeTiers.length>1;
  const i=el("input");i.type="range";i.min=sz.min;i.max=sz.max;i.step= tiered?0.1:0.5;i.value=Math.min(sz.max,Math.max(effMin,sz.value));
  i.style.border="none";i.style.padding="0";i.style.background="transparent";i.style.width="100%";
  if(gravure){ i.classList.add("rg-min"); const lo=(sz.max>sz.min)?((effMin-sz.min)/(sz.max-sz.min)*100):0; i.style.setProperty("--lo",Math.max(0,Math.min(100,lo))+"%"); }
  i.oninput=()=>{ let v=parseFloat(i.value); if(tiered){ v=snapTier(v); if(gravure&&v<effMin){ v=embedSizeTiers.filter(t=>t>=effMin).sort((a,b)=>a-b)[0]||effMin; } i.value=v; }
    else if(gravure&&v<effMin){v=effMin;i.value=v;} sz.value=v; const e=document.getElementById("szVal");if(e)e.textContent=sz.value+" cm"; applySizeScale();saveConfig();priceHead(); };
  f.appendChild(i);P.appendChild(f);
  P.appendChild(el("p","hintline", tiered
    ? `tailles disponibles : ${embedSizeTiers.map(t=>t+" cm").join(" · ")}`
    : `de ${sz.min} à ${sz.max} cm · cote affichée sur l'aperçu 3D`));
  if(gravure) P.appendChild(el("p","hintline",`Gravure choisie : tailles sous <b>${effMin} cm</b> indisponibles (surface insuffisante).`));
}
function stepRecap(P){
  if(state.qty==null)state.qty=1;
  P.appendChild(el("p","stepsub","Vérifie ta configuration avant d'ajouter au panier."));
  // quantité
  const qrow=el("div");qrow.style.cssText="display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px;font-size:14px";
  qrow.appendChild(el("span",null,"Quantité"));
  const qty=el("div","qty");
  const m=el("button",null,"−");m.onclick=()=>{state.qty=Math.max(1,state.qty-1);qs.textContent=state.qty;renderBillOnly();};
  const qs=el("span",null,String(state.qty));
  const pl=el("button",null,"+");pl.onclick=()=>{state.qty=state.qty+1;qs.textContent=state.qty;renderBillOnly();};
  qty.appendChild(m);qty.appendChild(qs);qty.appendChild(pl);qrow.appendChild(qty);
  P.appendChild(qrow);
  const ul=el("ul","bill");ul.id="billList";P.appendChild(ul);
  const ee=el("div","errline");ee.id="engErr";ee.hidden=true;P.appendChild(ee);
  const d=prodDelay();
  P.appendChild(el("p","hintline",`🖨️ Fabrication à la demande · expédié sous <b>${d.min}–${d.max} jours</b>.`));
  // partager / sauvegarder (masqué en mode embarqué : le panier Shopify gère la reprise)
  if(!EMBED){
    const sh=el("div");sh.style.cssText="display:flex;gap:8px;margin-top:8px";
    const bl=el("button","btn-sec","🔗 Copier le lien");bl.style.fontSize="13px";bl.style.padding="9px";
    bl.onclick=()=>{const link=shareLink(); (navigator.clipboard&&navigator.clipboard.writeText(link).then(()=>toast("Lien copié")).catch(()=>toast("Lien : "+link)))||toast("Lien : "+link);};
    sh.appendChild(bl);P.appendChild(sh);
    P.appendChild(el("p","hintline","Le lien recrée cette configuration · panier conservé sur cet appareil."));
  }
  renderBillOnly();
}

function renderBillOnly(){
  const ul=document.getElementById("billList"); if(!ul)return; ul.innerHTML="";
  const {lines,total}=priceBreakdown();
  lines.forEach(l=>ul.appendChild(el("li",null,`<span>${l.label}</span><span>${money(l.amount)}</span>`)));
  const q=state.qty||1;
  const useEmbed = EMBED && embedPrice && isFinite(embedPrice.amount);
  const unit = useEmbed ? embedPrice.amount : total;
  const fmt = useEmbed ? embMoney : money;
  if(q>1) ul.appendChild(el("li",null,`<span>Prix unitaire × ${q}</span><span>${fmt(unit)}</span>`));
  const ttc=unit*q, tva=ttc-ttc/(1+TENANT.tva);
  ul.appendChild(el("li",null,`<span>dont TVA ${Math.round(TENANT.tva*100)} %</span><span>${fmt(tva)}</span>`));
  ul.appendChild(el("li","total",`<span>Total TTC</span><span>${fmt(ttc)}</span>`));
  if(useEmbed && embedPrice.note) ul.appendChild(el("li",null,`<span style="color:var(--muted);font-size:12px">${embedPrice.note}</span><span></span>`));
  priceHead();
}
function render(){ renderPanel(); }   // recalcule tout le panneau

/* ===================== PANIER / COMMANDE (UI) ===================== */
const zbg=z=>(z.filaments&&z.filaments.length>1)?`linear-gradient(90deg,${z.filaments.join(',')})`:(z.hex||(z.filaments&&z.filaments[0])||'#888');
function lineThumb(l){ const t=el("div","cthumb"); const zs=(l.spec&&l.spec.zones&&l.spec.zones.length)?l.spec.zones:[{hex:'#888'}];
  zs.forEach(z=>{const s=el("div","vstrip");s.style.background=zbg(z);t.appendChild(s);}); return t; }
function openCart(){ renderCartSheet(); document.getElementById("cartOverlay").hidden=false; }
function closeCart(){ document.getElementById("cartOverlay").hidden=true; }
function renderCartSheet(){
  const S=document.getElementById("cartSheet"); S.innerHTML="";
  const head=el("div","sheethead");head.appendChild(el("h2",null,"Panier"));
  const x=el("button","xbtn","×");x.onclick=closeCart;head.appendChild(x);S.appendChild(head);
  if(!cart.length){ S.appendChild(el("p","hintline","Ton panier est vide."));
    const c=el("button","btn-sec","Continuer");c.style.marginTop="14px";c.onclick=closeCart;S.appendChild(c);return; }
  cart.forEach(l=>{ const line=el("div","cline"); line.appendChild(lineThumb(l));
    const info=el("div","cinfo");
    const propsTxt=Object.entries(l.properties||{}).filter(([k])=>k!=="Modèle 3D"&&k!=="Variante").map(([k,v])=>`${k}: ${v}`).join(" · ");
    info.appendChild(el("div","cn",(l.spec&&l.spec.modele)||l.properties.Variante||"Dragon"));
    info.appendChild(el("div","cprops",(l.properties.Variante||"")+(propsTxt?" · "+propsTxt:"")));
    const qty=el("div","qty");
    const m=el("button",null,"−");m.onclick=()=>{l.qty=Math.max(1,(l.qty||1)-1);saveCart();renderCartSheet();updateCartBadge();};
    const qs=el("span",null,String(l.qty||1));
    const pl=el("button",null,"+");pl.onclick=()=>{l.qty=(l.qty||1)+1;saveCart();renderCartSheet();updateCartBadge();};
    qty.appendChild(m);qty.appendChild(qs);qty.appendChild(pl);info.appendChild(qty);
    const rm=el("button","crm","retirer");rm.onclick=()=>{cart=cart.filter(x=>x.id!==l.id);saveCart();renderCartSheet();updateCartBadge();};info.appendChild(rm);
    line.appendChild(info);
    line.appendChild(el("div","cright",money((l.price||0)*(l.qty||1))));
    S.appendChild(line); });
  const sub=cartSubtotal(), tva=sub-sub/(1+TENANT.tva);
  const ul=el("ul","cbill");
  ul.innerHTML=`<li><span>Sous-total HT</span><span>${money(sub-tva)}</span></li><li><span>TVA ${Math.round(TENANT.tva*100)} %</span><span>${money(tva)}</span></li><li class="tot"><span>Total TTC</span><span>${money(sub)}</span></li>`;
  S.appendChild(ul);
  const pay=el("button","cta","Payer "+money(sub));pay.style.marginTop="14px";pay.onclick=checkout;S.appendChild(pay);
  S.appendChild(el("p","hintline","Paiement simulé (démo). En production : redirection vers le checkout Shopify."));
}
function checkout(){
  const S=document.getElementById("cartSheet"), n=cartCount(), total=cartSubtotal();
  const spec=cart.map(l=>({qty:l.qty||1, ...(l.spec||{})}));
  cart=[];saveCart();updateCartBadge();
  S.innerHTML="";
  const head=el("div","sheethead");head.appendChild(el("h2",null,"Commande confirmée ✓"));
  const x=el("button","xbtn","×");x.onclick=closeCart;head.appendChild(x);S.appendChild(head);
  S.appendChild(el("p","hintline",`Merci ! <b>${n}</b> article(s) · <b>${money(total)}</b> TTC. Email de confirmation (simulé) envoyé.`));
  S.appendChild(el("p","hintline","Fiche de production transmise à l'atelier :"));
  const pre=el("pre","spec");pre.style.whiteSpace="pre-wrap";pre.style.margin="0";pre.textContent=JSON.stringify(spec,null,2);S.appendChild(pre);
  const c=el("button","btn-sec","Fermer");c.style.marginTop="14px";c.onclick=closeCart;S.appendChild(c);
}
/* ===================== PARTAGE / LIEN ===================== */
function shareCode(){ const v=activeVariant();
  const sel={m:state.modelKey, vi:state.config.variants.indexOf(v),
    sl:(v?v.slots:[]).map(s=>({c:s.color,f:s.finishId||null})),
    sz:state.config.size?state.config.size.value:null,
    e:(state.config.engraving.added?{t:state.config.engraving.text,r:state.config.engraving.rot||0}:null)};
  return btoa(unescape(encodeURIComponent(JSON.stringify(sel)))); }
function shareLink(){ return location.origin+location.pathname+"#c="+encodeURIComponent(shareCode()); }
let pendingShare=null;
function applyPendingShare(){
  if(!pendingShare||pendingShare.m!==state.modelKey)return;
  const sel=pendingShare; const v=state.config.variants[sel.vi]||activeVariant();
  if(v){ state.config.activeVariantId=v.id; (sel.sl||[]).forEach((sd,i)=>{ if(v.slots[i]){v.slots[i].color=sd.c;v.slots[i].finishId=sd.f||null;} }); }
  if(sel.sz!=null&&state.config.size) state.config.size.value=sel.sz;
  if(sel.e){ state.config.engraving.added=true; state.config.engraving.text=sel.e.t||""; state.config.engraving.rot=sel.e.r||0; }
  pendingShare=null; saveConfig(); applyColors(); applySizeScale(); if(engraveCtx)drawEngrave();
  state.mode="client"; state.step=clientSteps().length-1; renderPanel();
}

/* ===================== BOOT ===================== */
document.getElementById("brandName").textContent=TENANT.brand.name;
document.getElementById("brandTag").textContent=TENANT.brand.tagline;
document.getElementById("modeAtelier").onclick=()=>{state.mode="atelier";renderPanel();};
document.getElementById("modeClient").onclick=()=>{state.mode="client";renderPanel();};
document.getElementById("btnNight").onclick=()=>{state.view.mode="nuit";setViewMode();};
document.getElementById("btnShade").onclick=()=>{state.view.mode="ombre";setViewMode();};
document.getElementById("btnSun").onclick=()=>{state.view.mode="soleil";setViewMode();};
document.getElementById("themeBtn").onclick=()=>{ userTheme=effectiveTheme()==="dark"?"light":"dark"; try{localStorage.setItem("onlyfab.theme",userTheme);}catch(e){} applyTheme(); };
document.getElementById("cartBtn").onclick=()=>{ state.mode="client"; openCart(); };
document.getElementById("cartOverlay").addEventListener("click",e=>{ if(e.target.id==="cartOverlay") closeCart(); });
const rb=document.getElementById("btnReset"); if(rb) rb.onclick=()=>{ cam.theta=0.6;cam.phi=1.2;cam.auto=true; frameScene(); };
applyTheme(); updateCartBadge();
/* --- Mode embarqué Shopify : force le mode client, masque atelier/panier, choisit le modèle --- */
if(EMBED){
  document.body.classList.add("embed");
  state.mode="client";
  try{ const mk=new URLSearchParams(location.search).get("model");
    if(mk && MODELS.find(m=>m.key===mk)) state.modelKey=mk; }catch(e){}
  // messages venant du thème hôte (sélection de modèle, accusés d'ajout)
  window.addEventListener("message",ev=>{
    const d=ev.data||{}; if(d.source!=="onlyfab-host") return;
    if(d.type==="select-model" && d.model && MODELS.find(m=>m.key===d.model)){
      const m=MODELS.find(x=>x.key===d.model); state.modelKey=d.model; if(typeof selectModel==="function") selectModel(m); }
    else if(d.type==="configure"){
      if(Array.isArray(d.sizeTiers)&&d.sizeTiers.length){ embedSizeTiers=d.sizeTiers.map(Number).filter(x=>isFinite(x)).sort((a,b)=>a-b);
        if(state.config&&state.config.size){ state.config.size.min=embedSizeTiers[0]; state.config.size.max=embedSizeTiers[embedSizeTiers.length-1];
          state.config.size.value=snapTier(state.config.size.value); applySizeScale&&applySizeScale(); } }
      if(d.currency||d.locale) embedPrice=Object.assign({},embedPrice,{currency:d.currency,locale:d.locale,amount:(embedPrice&&embedPrice.amount)});
      renderPanel(); }
    else if(d.type==="setprice"){ embedPrice={amount:+d.amount, currency:d.currency||(embedPrice&&embedPrice.currency), locale:d.locale||(embedPrice&&embedPrice.locale), note:d.note||null};
      updatePriceDisplay(); }
    else if(d.type==="added"){ toast("Ajouté au panier ✓"); }
    else if(d.type==="error"){ toast(d.message||"Impossible d'ajouter au panier."); }
  });
}
// lien de partage : #c=<code> -> recrée la config
try{ const h=location.hash||""; const mm=h.match(/[#&]c=([^&]+)/); if(mm){ pendingShare=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(mm[1]))))); } }catch(e){ pendingShare=null; }
if(pendingShare && pendingShare.m){ const mk=pendingShare.m; state.modelKey=mk; }
state.config=loadConfig(["body","wings","spine"]);
renderPanel();
if(THREE_OK){
  initThree(); if(!GLTF_OK) toast("Chargeur GLB indisponible ici.");
  if(GLTF_OK){
    const decode=(b64)=>{ const bs=atob(b64); const u=new Uint8Array(bs.length); for(let i=0;i<bs.length;i++)u[i]=bs.charCodeAt(i); return u.buffer; };
    try{ if(DEFAULT_GLB_B64 && DEFAULT_GLB_B64.slice(0,2)!=="__") GLB_BUFFERS.baby=decode(DEFAULT_GLB_B64); }catch(err){ console.error("baby glb",err); }
    try{ if(ROSE_GLB_B64 && ROSE_GLB_B64.slice(0,2)!=="__") GLB_BUFFERS.rose=decode(ROSE_GLB_B64); }catch(err){ console.error("rose glb",err); }
    const first=(pendingShare&&pendingShare.m&&MODELS.find(m=>m.key===pendingShare.m))||MODELS.find(m=>m.key===state.modelKey)||MODELS[0];
    if(first.src==="placeholder"||GLB_BUFFERS.baby) selectModel(first);   // charge le modèle (partagé ou 1er)
  }
}
else document.querySelector(".stage").innerHTML='<div class="hint" style="position:static;padding:40px">Aperçu 3D indisponible.</div>';
if(EMBED){ postToHost("ready",{models:MODELS.map(m=>({key:m.key,name:m.name})), model:state.modelKey}); }
</script>
