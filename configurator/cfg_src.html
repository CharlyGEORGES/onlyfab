function stepTaille(P){
  const sz=state.config.size; if(!sz){P.appendChild(el("p","hintline","—"));return;}
  const effMin=engEffMin(), gravure=engraveChosen()&&effMin>sz.min;
  const tiers=sizeTiers(); let cur=currentTier()||tiers[0];
  if(gravure && tierCm(cur)<effMin){ cur=tiers.find(t=>tierCm(t)>=effMin)||cur; }
  if(cur&&(sz.tier!==cur.key||sz.value!==tierCm(cur))){ setTier(cur); applySizeScale(); saveConfig(); priceHead(); }
  P.appendChild(el("p","stepsub","Choisis la taille du dragon — le prix s'ajuste automatiquement."));
  const row=el("div","tiers");
  const priceFor=cm=>{ const v=activeVariant(); const base=v?v.price:0; const r=sz.refCm||10, e=(sz.exp!=null?sz.exp:2);
    let sup=0; if(v) v.slots.forEach(sl=>sup+=slotSurcharge(sl)); const eng=state.config.engraving; const fee=(eng.offered&&eng.added&&(eng.text||"").trim())?eng.fee:0;
    return +(round1(base*Math.pow(cm/r,e))+sup+fee).toFixed(2); };
  tiers.forEach(t=>{ const cm=tierCm(t), off=gravure&&cm<effMin;
    const b=el("button","tierbtn"); b.type="button"; b.disabled=off; b.setAttribute("aria-pressed", t.key===cur.key);
    b.innerHTML=`<span class="tl">${t.label}</span><span class="tc">${cm} cm</span><span class="tp">${off?"—":money(priceFor(cm))}</span>`;
    b.title=off?`Indisponible avec gravure (surface insuffisante)`:`${t.label} · ${cm} cm`;
    b.onclick=()=>{ if(off)return; setTier(t); applySizeScale(); saveConfig(); priceHead(); renderPanel(); };
    row.appendChild(b); });
  P.appendChild(row);
  P.appendChild(el("p","hintline",`Taille : <b>${sizeLabel()}</b> · cote affichée sur l'aperçu 3D`));
  if(gravure){ const mt=state.config.engraving.minTier?tierByKey(state.config.engraving.minTier):nearestTier(effMin); P.appendChild(el("p","hintline",`Gravure choisie : disponible à partir de <b>${mt?mt.label:effMin+" cm"}</b>.`)); }
}
function setHostError(msg){ const e=document.getElementById("hostErr"); if(!e)return; e.textContent=msg||""; e.hidden=!msg; }
function stepRecap(P){
  if(state.qty==null)state.qty=1;
  P.appendChild(el("p","stepsub","Vérifie ta configuration avant d'ajouter au panier."));
  // partager / retrouver : la configuration reçoit une référence courte, le lien la rouvre telle quelle
  { const sh=el("div");sh.style.cssText="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px";
    const bl=el("button","btn-sec","🔗 Copier le lien de ce dragon");bl.type="button";bl.style.fontSize="13px";bl.style.padding="9px 12px";
    const ref=el("span","hintline",state.shareRef?("Réf. <b>"+state.shareRef+"</b>"):"");ref.style.margin="0";
    bl.onclick=async()=>{ bl.disabled=true; const {id,url}=await shareLink(); bl.disabled=false;
      if(id){ state.shareRef=id; ref.innerHTML="Réf. <b>"+id+"</b>"; }
      const done=()=>toast(id?("Lien copié · réf. "+id):"Lien copié");
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done).catch(()=>prompt("Lien à copier :",url)); else prompt("Lien à copier :",url); };
    sh.appendChild(bl); sh.appendChild(ref); P.appendChild(sh);
    const he=el("div","errline");he.id="hostErr";he.hidden=true;P.appendChild(he); }
  if(typeof THREE!=="undefined" && root && state.rig){
    const cb=el("button","cinebtn","▶ Revoir l'aperçu animé");cb.type="button";
    cb.onclick=()=>{ if(!cine.active) cineStart(false); };
    P.appendChild(cb);
    // Lancement AUTOMATIQUE à la 1re arrivée au récap (l'utilisateur a déjà
    // interagi via les étapes -> l'autoplay est autorisé). Repli silencieux sinon.
    if(!cine.active && !cine.autoDone){ cine.autoDone=true; setTimeout(()=>{ if(!cine.active && state.step===clientSteps().length-1) cineStart(true); }, 450); }
  }
  // quantité
  const qrow=el("div");qrow.style.cssText="display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px;font-size:14px";
  qrow.appendChild(el("span",null,"Quantité"));
  const qty=el("div","qty");
  const m=el("button",null,"−");m.onclick=()=>{state.qty=Math.max(1,state.qty-1);qs.textContent=state.qty;renderBillOnly();};
  const qs=el("span",null,String(state.qty));
  const pl=el("button",null,"+");pl.onclick=()=>{state.qty=state.qty+1;qs.textContent=state.qty;renderBillOnly();};
  qty.appendChild(m);qty.appendChild(qs);qty.appendChild(pl);qrow.appendChild(qty);
  P.appendChild(qrow);
  const ul=el("ul","bill");ul.id="billList";P.appendChild(ul);
  const ee=el("div","errline");ee.id="engErr";ee.hidden=true;P.appendChild(ee);
  const d=prodDelay();
  P.appendChild(el("p","hintline",`🖨️ Fabrication à la demande · expédié sous <b>${d.min} à ${d.max} jours</b>.`));
  renderBillOnly(ul);
}

function renderBillOnly(ulEl){
  const ul=ulEl||document.getElementById("billList"); if(!ul)return; ul.innerHTML="";   // le récap passe son <ul> (pas encore attaché au DOM)
  const {lines,total}=priceBreakdown();
  lines.forEach(l=>ul.appendChild(el("li",null,`<span>${l.label}</span><span>${money(l.amount)}</span>`)));
  const q=state.qty||1;
  const useEmbed = EMBED && embedPrice && isFinite(embedPrice.amount);
  const unit = useEmbed ? embedPrice.amount : total;
  const fmt = useEmbed ? embMoney : money;
  if(q>1) ul.appendChild(el("li",null,`<span>Prix unitaire × ${q}</span><span>${fmt(unit)}</span>`));
  const ttc=unit*q, tva=ttc-ttc/(1+TENANT.tva);
  ul.appendChild(el("li",null,`<span>dont TVA ${Math.round(TENANT.tva*100)} %</span><span>${fmt(tva)}</span>`));
  ul.appendChild(el("li","total",`<span>Total TTC</span><span>${fmt(ttc)}</span>`));
  if(useEmbed && embedPrice.note) ul.appendChild(el("li",null,`<span style="color:var(--muted);font-size:12px">${embedPrice.note}</span><span></span>`));
  priceHead();
}
function render(){ renderPanel(); }   // recalcule tout le panneau

/* ===================== PANIER / COMMANDE (UI) ===================== */
const zbg=z=>(z.filaments&&z.filaments.length>1)?`linear-gradient(90deg,${z.filaments.join(',')})`:(z.hex||(z.filaments&&z.filaments[0])||'#888');
function lineThumb(l){ const t=el("div","cthumb"); const zs=(l.spec&&l.spec.zones&&l.spec.zones.length)?l.spec.zones:[{hex:'#888'}];
  zs.forEach(z=>{const s=el("div","vstrip");s.style.background=zbg(z);t.appendChild(s);}); return t; }
function openCart(){ renderCartSheet(); document.getElementById("cartOverlay").hidden=false; }
function closeCart(){ document.getElementById("cartOverlay").hidden=true; }
function renderCartSheet(){
  const S=document.getElementById("cartSheet"); S.innerHTML="";
  const head=el("div","sheethead");head.appendChild(el("h2",null,"Panier"));
  const x=el("button","xbtn","×");x.onclick=closeCart;head.appendChild(x);S.appendChild(head);
  if(!cart.length){ S.appendChild(el("p","hintline","Ton panier est vide."));
    const c=el("button","btn-sec","Continuer");c.style.marginTop="14px";c.onclick=closeCart;S.appendChild(c);return; }
  cart.forEach(l=>{ const line=el("div","cline"); line.appendChild(lineThumb(l));
    if(l.ref){ const rf=el("div","hintline","Réf. "+l.ref); rf.style.margin="0"; line.appendChild(rf); }
    const info=el("div","cinfo");
    const propsTxt=Object.entries(l.properties||{}).filter(([k])=>k!=="Modèle 3D"&&k!=="Variante"&&k!=="Référence config"&&!k.startsWith("_")).map(([k,v])=>`${k}: ${v}`).join(" · ");
    info.appendChild(el("div","cn",(l.spec&&l.spec.modele)||l.properties.Variante||"Dragon"));
    info.appendChild(el("div","cprops",(l.properties.Variante||"")+(propsTxt?" · "+propsTxt:"")));
    const qty=el("div","qty");
    const m=el("button",null,"−");m.onclick=()=>{l.qty=Math.max(1,(l.qty||1)-1);saveCart();renderCartSheet();updateCartBadge();};
    const qs=el("span",null,String(l.qty||1));
    const pl=el("button",null,"+");pl.onclick=()=>{l.qty=(l.qty||1)+1;saveCart();renderCartSheet();updateCartBadge();};
    qty.appendChild(m);qty.appendChild(qs);qty.appendChild(pl);info.appendChild(qty);
    const rm=el("button","crm","retirer");rm.onclick=()=>{cart=cart.filter(x=>x.id!==l.id);saveCart();renderCartSheet();updateCartBadge();};info.appendChild(rm);
    line.appendChild(info);
    line.appendChild(el("div","cright",money((l.price||0)*(l.qty||1))));
    S.appendChild(line); });
  const sub=cartSubtotal(), tva=sub-sub/(1+TENANT.tva);
  const ul=el("ul","cbill");
  ul.innerHTML=`<li><span>Sous-total HT</span><span>${money(sub-tva)}</span></li><li><span>TVA ${Math.round(TENANT.tva*100)} %</span><span>${money(tva)}</span></li><li class="tot"><span>Total TTC</span><span>${money(sub)}</span></li>`;
  S.appendChild(ul);
  const pay=el("button","cta","Payer "+money(sub));pay.style.marginTop="14px";pay.onclick=checkout;S.appendChild(pay);
  S.appendChild(el("p","hintline","Paiement simulé (démo). En production : redirection vers le checkout Shopify."));
}
function checkout(){
  const S=document.getElementById("cartSheet"), n=cartCount(), total=cartSubtotal();
  const spec=cart.map(l=>({qty:l.qty||1, ...(l.spec||{})}));
  cart=[];saveCart();updateCartBadge();
  S.innerHTML="";
  const head=el("div","sheethead");head.appendChild(el("h2",null,"Commande confirmée ✓"));
  const x=el("button","xbtn","×");x.onclick=closeCart;head.appendChild(x);S.appendChild(head);
  S.appendChild(el("p","hintline",`Merci ! <b>${n}</b> article(s) · <b>${money(total)}</b> TTC. Email de confirmation (simulé) envoyé.`));
  S.appendChild(el("p","hintline","Fiche de production transmise à l'atelier :"));
  const pre=el("pre","spec");pre.style.whiteSpace="pre-wrap";pre.style.margin="0";pre.textContent=JSON.stringify(spec,null,2);S.appendChild(pre);
  const c=el("button","btn-sec","Fermer");c.style.marginTop="14px";c.onclick=closeCart;S.appendChild(c);
}
/* ===================== PARTAGE / RÉFÉRENCE ===================== */
/* La configuration du client est enregistrée côté serveur sous une référence courte
   (8 caractères). Elle sert au lien de partage ET à retrouver le dragon d'une commande
   (la référence est posée sur la ligne de commande Shopify). */
function shareSel(){ const v=activeVariant();
  return {m:state.modelKey, vi:state.config.variants.indexOf(v),
    sl:(v?v.slots:[]).map(s=>({c:s.color,f:s.finishId||null})),
    sz:state.config.size?state.config.size.value:null,
    e:(state.config.engraving.added?{t:state.config.engraving.text,r:state.config.engraving.rot||0}:null)}; }
function shareCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(shareSel())))); }
const SHARE_ID_RE=/^[A-Z0-9]{8}$/i;
let embedPageUrl=null;            // URL de la page boutique hôte (pour un lien qui rouvre le dragon dans la boutique)
/* Enregistre la configuration courante ; renvoie {id,url} ou null si le serveur ne répond pas. */
async function shareSave(source){
  try{
    const r=await fetch("/api/configurator/share",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:state.modelKey, sel:shareSel(), spec:productionSpec(), properties:cartPayload().properties, qty:Math.max(1,state.qty||1), source:source||"share"})});
    if(!r.ok) return null; const d=await r.json(); return (d&&d.id)?d:null;
  }catch(e){ return null; }
}
/* Lien qui rouvre la configuration : page boutique (?oc=REF) en mode embarqué, sinon le configurateur. */
function shareUrlFor(id){
  if(EMBED&&embedPageUrl){ const u=embedPageUrl.split("#")[0]; return u+(u.includes("?")?"&":"?")+"oc="+id; }
  return location.origin+location.pathname+"?c="+id;
}
async function shareLink(){
  const saved=await shareSave("share");
  if(saved) return {id:saved.id, url:shareUrlFor(saved.id)};
  return {id:null, url:location.origin+location.pathname+"#c="+encodeURIComponent(shareCode())};   // repli hors-ligne
}
/* Récupère une configuration par référence -> objet sel (ou null). */
async function shareFetch(id){
  try{ const r=await fetch("/api/configurator/share/"+encodeURIComponent(id),{credentials:"same-origin"}); if(!r.ok) return null;
    const d=await r.json(); return (d&&d.sel)?Object.assign({},d.sel,{ref:d.id}):null; }catch(e){ return null; }
}
/* Décode ce que contient l'URL : ?c=REF | ?c=<code> | #c=<code> | ?oc=REF ; renvoie sel ou null. */
async function shareFromUrl(){
  let raw=null;
  try{ const q=new URLSearchParams(location.search); raw=q.get("c")||q.get("oc"); }catch(e){}
  if(!raw){ try{ const mm=(location.hash||"").match(/[#&]c=([^&]+)/); if(mm) raw=decodeURIComponent(mm[1]); }catch(e){} }
  if(!raw) return null;
  if(SHARE_ID_RE.test(raw)) return await shareFetch(raw.toUpperCase());
  try{ return JSON.parse(decodeURIComponent(escape(atob(raw)))); }catch(e){ return null; }
}
/* Ouvre une configuration (sel) : charge le modèle si besoin, applique, va au récap. */
function shareOpen(sel){
  if(!sel||!sel.m) return false;
  pendingShare=sel;
  const m=MODELS.find(x=>x.key===sel.m); if(!m){ pendingShare=null; toast("Modèle introuvable : "+sel.m); return false; }
  if(state.loading===sel.m) return true;    // chargement en cours : appliqué à la fin
  if(sel.m!==state.modelKey||!state.config){ state.modelKey=sel.m; selectModel(m); } else applyPendingShare();
  return true;
}
let pendingShare=null;
function applyPendingShare(){
  if(!pendingShare||pendingShare.m!==state.modelKey)return;
  const sel=pendingShare; const v=state.config.variants[sel.vi]||activeVariant();
  if(v){ state.config.activeVariantId=v.id; (sel.sl||[]).forEach((sd,i)=>{ if(v.slots[i]){v.slots[i].color=sd.c;v.slots[i].finishId=sd.f||null;} }); }
  if(sel.sz!=null&&state.config.size){ const t=nearestTier(sel.sz); if(t) setTier(t); else state.config.size.value=sel.sz; }
  if(sel.e){ state.config.engraving.added=true; state.config.engraving.text=sel.e.t||""; state.config.engraving.rot=sel.e.r||0; }
  else { state.config.engraving.added=false; state.config.engraving.text=""; }
  state.shareRef=sel.ref||null;
  pendingShare=null; applyColors(); applySizeScale(); if(engraveCtx)drawEngrave(); try{updateEngraveVisibility();}catch(e){}
  state.mode="client"; state.step=clientSteps().length-1; renderPanel();
  if(sel.ref) toast("Configuration "+sel.ref+" rouverte");
}

/* ===================== BOOT ===================== */
/* Le demarrage attend /api/configurator/configs : les configs viennent du
   serveur et la reponse dit si la session est admin (mode atelier). */
function boot(){
document.getElementById("brandName").textContent=TENANT.brand.name;
document.getElementById("brandTag").textContent=TENANT.brand.tagline;
document.getElementById("modeAtelier").onclick=()=>{ if(!IS_ADMIN) return; state.mode="atelier";renderPanel();};
document.getElementById("modeClient").onclick=()=>{state.mode="client";renderPanel();};
document.getElementById("btnNight").onclick=()=>{state.view.mode="nuit";setViewMode();};
document.getElementById("btnShade").onclick=()=>{state.view.mode="ombre";setViewMode();};
document.getElementById("btnSun").onclick=()=>{state.view.mode="soleil";setViewMode();};
document.getElementById("themeBtn").onclick=()=>{ userTheme=effectiveTheme()==="dark"?"light":"dark"; try{localStorage.setItem("onlyfab.theme",userTheme);}catch(e){} applyTheme(); };
document.getElementById("cartBtn").onclick=()=>{ state.mode="client"; openCart(); };
document.getElementById("cartOverlay").addEventListener("click",e=>{ if(e.target.id==="cartOverlay") closeCart(); });
const rb=document.getElementById("btnReset"); if(rb) rb.onclick=()=>{ cam.theta=0.6;cam.phi=1.2;cam.auto=true; frameScene(); };
/* ---- musique d'ambiance (off par défaut, démarre au clic — autoplay bloqué) ---- */
(function(){
  const btn=document.getElementById("btnMusic"), audio=document.getElementById("bgm");
  if(!btn||!audio) return;
  const MUSIC_URL="/configurateur/music.mp3";
  audio.volume=0.35;
  let on=false;
  const setBtn=()=>{ btn.setAttribute("aria-pressed",on); btn.textContent=on?"♪ Musique ●":"♪ Musique"; };
  btn.onclick=()=>{
    if(on){ audio.pause(); on=false; setBtn(); try{localStorage.setItem("onlyfab.music","0");}catch(e){} return; }
    if(!audio.src) audio.src=MUSIC_URL;
    audio.play().then(()=>{ on=true; setBtn(); try{localStorage.setItem("onlyfab.music","1");}catch(e){} })
      .catch(()=>{ on=false; setBtn(); toast("Musique indisponible ici."); });
  };
  setBtn();
})();

applyTheme(); updateCartBadge();
/* --- Mode embarqué Shopify : force le mode client, masque atelier/panier, choisit le modèle --- */
if(EMBED){
  document.body.classList.add("embed");
  state.mode="client";
  try{ const mk=new URLSearchParams(location.search).get("model");
    if(mk && MODELS.find(m=>m.key===mk)) state.modelKey=mk; }catch(e){}
  // messages venant du thème hôte (sélection de modèle, accusés d'ajout)
  window.addEventListener("message",ev=>{
    const d=ev.data||{}; if(d.source!=="onlyfab-host") return;
    if(d.type==="select-model" && d.model && MODELS.find(m=>m.key===d.model)){
      // déjà chargé (ou en cours) : ne pas recharger, cela écraserait une configuration rouverte par référence
      if(d.model===state.modelKey && (state.glb||state.loading===d.model)) return;
      const m=MODELS.find(x=>x.key===d.model); state.modelKey=d.model; if(typeof selectModel==="function") selectModel(m); }
    else if(d.type==="configure"){
      embedConfigured=true;
      if(Array.isArray(d.sizeTiers)&&d.sizeTiers.length){ embedSizeTiers=d.sizeTiers.map(Number).filter(x=>isFinite(x)).sort((a,b)=>a-b); }   // informatif : les paliers viennent de l'atelier
      if(d.currency||d.locale) embedPrice=Object.assign({},embedPrice,{currency:d.currency,locale:d.locale,amount:(embedPrice&&embedPrice.amount)});
      if(typeof d.pageUrl==="string"&&/^https?:/.test(d.pageUrl)) embedPageUrl=d.pageUrl;
      renderPanel();
      if(typeof d.share==="string"&&SHARE_ID_RE.test(d.share)) shareFetch(d.share.toUpperCase()).then(sel=>{ if(sel) shareOpen(sel); }); }
    else if(d.type==="setprice"){ embedPrice={amount:+d.amount, currency:d.currency||(embedPrice&&embedPrice.currency), locale:d.locale||(embedPrice&&embedPrice.locale), note:d.note||null};
      updatePriceDisplay(); }
    else if(d.type==="added"){ toast("Ajouté au panier ✓"); setHostError(""); }
    else if(d.type==="error"){ toast(d.message||"Impossible d'ajouter au panier."); setHostError("⚠ "+(d.message||"Impossible d'ajouter au panier.")); }
  });
}
// lien de partage / référence (résolu avant boot, voir plus bas) -> recrée la config
if(pendingShare && pendingShare.m){ const mk=pendingShare.m; state.modelKey=mk; }
state.config=loadConfig(["body","wings","spine"]);
renderPanel();
if(THREE_OK){
  initThree(); if(!GLTF_OK) toast("Chargeur GLB indisponible ici.");
  if(GLTF_OK){
    const first=(pendingShare&&pendingShare.m&&MODELS.find(m=>m.key===pendingShare.m))||MODELS.find(m=>m.key===state.modelKey)||MODELS[0];
    if(first) selectModel(first);   // charge le modèle (partagé ou 1er)
  }
}
else document.querySelector(".stage").innerHTML='<div class="hint" style="position:static;padding:40px">Aperçu 3D indisponible.</div>';
if(EMBED){
  // « ready » est renvoyé tant que l'hôte n'a pas répondu « configure » : le pont du thème
  // (script defer) peut ne pas être encore chargé quand l'iframe est prête.
  const hello=()=>postToHost("ready",{models:MODELS.map(m=>({key:m.key,name:m.name})), model:state.modelKey});
  hello(); let tries=0; const h=setInterval(()=>{ if(embedConfigured||++tries>8){ clearInterval(h); return; } hello(); },1200);
}
}
(async()=>{
  try{
    const r=await fetch("/api/configurator/configs",{credentials:"same-origin"});
    if(r.ok){ const d=await r.json(); SERVER_CONFIGS=d.configs||{}; IS_ADMIN=!!d.admin; }
    await apiModels();
  }catch(e){}
  try{ pendingShare=await shareFromUrl(); }catch(e){ pendingShare=null; }
  if(!MODELS.length){ MODELS=[{key:"dragon",name:"Dragon",emoji:"🐉",src:"placeholder",glbUrl:null,seed:{}}]; }
  if(!MODELS.find(m=>m.key===state.modelKey)) state.modelKey=MODELS[0].key;
  if(!IS_ADMIN) document.body.classList.add("noadmin");
  else if(!EMBED) state.mode="atelier";   // l'admin arrive directement dans l'atelier
  boot();
})();
</script>
