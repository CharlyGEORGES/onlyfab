app = "onlyfab"
primary_region = "cdg"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_PATH = "/data/stock.db"
  UPLOADS_DIR = "/data/uploads"
    CONFIGURATOR_FRAME_ANCESTORS = "'self' https://onlyfab.fr https://www.onlyfab.fr https://*.myshopify.com https://admin.shopify.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "onlyfab_data"
  destination = "/data"
