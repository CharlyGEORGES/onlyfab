<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En mémoire d'Alain Georges</title>
<meta name="description" content="Un lieu pour se souvenir, partager des photos et des souvenirs.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238a6d3b'/%3E%3Cpath d='M16 7c3 5 5 7 5 11a5 5 0 0 1-10 0c0-4 2-6 5-11z' fill='%23fff3c0'/%3E%3C/svg%3E">
</head>
<body>
<div id="app"><div class="lock"><p class="muted">Chargement…</p></div></div>

<!-- Gabarits -->
<template id="tpl-site">
  <div id="banner" class="banner hidden"></div>

  <header class="hero" id="top">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-content wrap">
      <img id="portrait" class="portrait hidden" alt="">
      <h1 id="name"></h1>
      <div class="dates" id="dates"></div>
      <p class="subtitle" id="subtitle"></p>
      <nav id="nav"></nav>
    </div>
  </header>

  <section id="intro" class="hidden">
    <div class="narrow">
      <p class="quote" id="quote"></p>
    </div>
  </section>

  <section id="practical" class="hidden">
    <div class="narrow">
      <div class="notice">
        <h3>Informations pratiques</h3>
        <div id="ceremony" class="prose-plain"></div>
        <p id="donation" class="hidden"><a class="btn btn-sm" target="_blank" rel="noopener" id="donation-link"></a></p>
      </div>
    </div>
  </section>

  <section id="story" class="hidden">
    <div class="narrow">
      <div class="section-head"><div class="kicker">Sa vie</div><h2>Qui il était</h2></div>
      <div class="prose" id="main-text"></div>
    </div>
  </section>

  <section id="timeline-section" class="hidden">
    <div class="narrow">
      <div class="section-head"><div class="kicker">Frise de vie</div><h2>Les grandes étapes</h2></div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <section id="gallery-section" class="hidden">
    <div class="wrap">
      <div class="section-head"><div class="kicker">Photos</div><h2>En images</h2></div>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>

  <section id="memories-section" class="hidden">
    <div class="wrap">
      <div class="section-head"><div class="kicker">Souvenirs</div><h2>Ce que vous gardez de lui</h2></div>
      <div class="memories" id="memories"></div>
    </div>
  </section>

  <section id="candles" class="hidden">
    <div class="narrow candles">
      <div class="flame-wrap"><div class="flame"></div><div class="candle-body"></div></div>
      <div class="candle-count" id="candle-count">0</div>
      <p class="muted">bougies allumées en sa mémoire</p>
      <div class="candle-names" id="candle-names"></div>
      <div class="candle-actions"><button id="light-candle">Allumer une bougie</button></div>
    </div>
  </section>

  <section id="family-section" class="hidden">
    <div class="wrap">
      <div class="section-head"><div class="kicker">Ses proches</div><h2>Sa famille</h2></div>
      <div id="family"></div>
    </div>
  </section>

  <section id="map-section" class="hidden">
    <div class="wrap">
      <div class="section-head"><div class="kicker">Lieux</div><h2>Les endroits de sa vie</h2></div>
      <div id="map"></div>
    </div>
  </section>

  <section id="contribute" class="hidden">
    <div class="narrow">
      <div class="section-head"><div class="kicker">Participer</div><h2>Partager un souvenir</h2>
        <p class="muted">Un texte, une photo, un message vocal… Votre contribution sera relue par la famille avant d'être publiée.</p></div>
      <form id="contrib-form" class="card">
        <div class="row">
          <div class="field"><label for="c-author">Votre nom *</label><input id="c-author" name="author" required maxlength="80" autocomplete="name"></div>
          <div class="field"><label for="c-email">Votre courriel (facultatif, jamais publié)</label><input id="c-email" name="email" type="email" maxlength="120" autocomplete="email"></div>
        </div>
        <div class="field"><label for="c-title">Titre (facultatif)</label><input id="c-title" name="title" maxlength="120" placeholder="Ex. : L'été 1998 à Quiberon"></div>
        <div class="field"><label for="c-body">Votre souvenir</label><textarea id="c-body" name="body" maxlength="5000" placeholder="Racontez un moment, une anecdote, ce qu'il représentait pour vous…"></textarea></div>
        <div class="row">
          <div class="field"><label for="c-date">Date ou année du souvenir (facultatif)</label><input id="c-date" name="taken_at" maxlength="40" placeholder="1998, été 2005…"></div>
          <div class="field"><label for="c-place">Lieu (facultatif)</label><input id="c-place" name="place" maxlength="120"></div>
        </div>
        <div class="field">
          <label>Photo ou enregistrement</label>
          <div class="dropzone" id="dropzone">
            <div>Déposez une photo ici ou <u>choisissez un fichier</u></div>
            <div class="hint">JPEG, PNG, WebP (redimensionnée automatiquement) ou fichier audio</div>
            <input type="file" id="c-file" accept="image/*,audio/*" class="hidden">
          </div>
          <div class="preview hidden" id="preview"></div>
          <div style="margin-top:.8em; display:flex; gap:.6em; flex-wrap:wrap; align-items:center">
            <button type="button" class="btn-soft btn-sm" id="rec-btn">🎙️ Enregistrer un message vocal</button>
            <span id="rec-status" class="hint"></span>
          </div>
        </div>
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
        <div style="display:flex; gap:1em; align-items:center; flex-wrap:wrap">
          <button type="submit" id="c-submit">Envoyer à la famille</button>
          <span class="hint">Publié après validation.</span>
        </div>
      </form>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <div class="actions">
        <button class="btn-soft btn-sm" id="print-btn">🖨️ Imprimer le livre de souvenirs</button>
        <button class="btn-soft btn-sm" id="share-btn">🔗 Partager ce site</button>
        <a class="btn btn-ghost btn-sm" href="/admin" id="admin-link">Espace famille</a>
      </div>
      <div id="footer-name"></div>
    </div>
  </footer>
</template>

<template id="tpl-lock">
  <div class="lock">
    <form class="card" id="lock-form">
      <h1 class="serif" style="font-size:2.2rem" id="lock-name"></h1>
      <p class="muted" id="lock-dates"></p>
      <p>Ce site est réservé aux proches. Entrez le code transmis par la famille.</p>
      <div class="field"><input id="lock-code" placeholder="Code d'accès" autocomplete="off" required></div>
      <button type="submit">Entrer</button>
      <p class="hint" id="lock-error" style="color:var(--danger)"></p>
    </form>
  </div>
</template>

<script src="/shared.js"></script>
<script src="/app.js"></script>
</body>
</html>
