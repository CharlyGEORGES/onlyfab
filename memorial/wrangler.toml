# Site mémorial — Cloudflare Workers (offre gratuite)
# Après `npm run setup`, les identifiants de la base D1 et de l'espace KV sont
# remplis automatiquement ci-dessous.
name = "alain-georges"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "public"
# Les requêtes /api/* et /media/* passent par le worker, le reste est servi
# comme fichiers statiques (HTML, CSS, JS).
run_worker_first = ["/api/*", "/media/*"]

# Base de données (SQLite hébergé, 5 Go gratuits)
[[d1_databases]]
binding = "DB"
database_name = "alain-georges"
database_id = "A_REMPLIR"

# Stockage des photos et enregistrements audio (1 Go gratuit, sans carte bancaire)
[[kv_namespaces]]
binding = "MEDIA"
id = "A_REMPLIR"

[vars]
# Nom affiché dans les courriels de notification (facultatif)
SITE_NAME = "En mémoire d'Alain Georges"

# Secrets à définir avec `npx wrangler secret put <NOM>` :
#   ADMIN_PASSWORD   mot de passe de l'espace d'administration (plusieurs possibles, séparés par des virgules)
#   SESSION_SECRET   chaîne aléatoire longue pour signer les cookies de session
#   RESEND_API_KEY   (facultatif) clé https://resend.com pour recevoir un courriel à chaque contribution
#   NOTIFY_EMAIL     (facultatif) adresse qui reçoit ces notifications
